name: Build release installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:run

  package:
    name: ${{ matrix.label }}
    needs: checks
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 11 compatible (x64)
            runner: windows-2025
            build-args: --win nsis --x64
            artifact-name: bloom-canvas-windows-x64
            artifact-path: dist/*-windows-x64-setup.exe
          - label: macOS Intel (x64)
            runner: macos-15-intel
            build-args: --mac dmg --x64
            artifact-name: bloom-canvas-macos-x64
            artifact-path: dist/*-mac-x64.dmg
          - label: macOS Apple Silicon (arm64)
            runner: macos-15
            build-args: --mac dmg --arm64
            artifact-name: bloom-canvas-macos-arm64
            artifact-path: dist/*-mac-arm64.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm exec electron-vite build

      - name: Build installer
        run: pnpm exec electron-builder ${{ matrix.build-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          base_tag="v${version}"
          release_tag="${base_tag}"

          if git rev-parse --verify --quiet "refs/tags/${base_tag}" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "${base_tag}")"
            if [[ "${tagged_sha}" != "${GITHUB_SHA}" ]]; then
              release_tag="${base_tag}-${GITHUB_SHA::7}"
            fi
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "title=Bloom Canvas ${version}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/*.exe release-assets/*.dmg --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/*.exe release-assets/*.dmg \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              --latest
          fi
