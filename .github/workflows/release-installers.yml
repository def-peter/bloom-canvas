name: Build release installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Reject an existing release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          release_tag="v${version}"
          if gh release view "${release_tag}" >/dev/null 2>&1 || \
            git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists. Increase package.json version before publishing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

      - name: Test
        run: yarn test:run

  package:
    name: ${{ matrix.label }}
    needs: checks
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 11 compatible (x64)
            runner: windows-2025
            build-args: --win nsis --x64
            artifact-name: bloom-canvas-windows-x64
            artifact-path: |
              dist/*-windows-x64-setup.exe
              dist/*-windows-x64-setup.exe.blockmap
              dist/latest.yml
          - label: macOS Intel (x64)
            runner: macos-15-intel
            build-args: --mac dmg zip --x64
            artifact-name: bloom-canvas-macos-x64
            artifact-path: |
              dist/*-mac-x64.dmg
              dist/*-mac-x64.zip
              dist/*-mac-x64.zip.blockmap
              dist/latest-mac.yml
          - label: macOS Apple Silicon (arm64)
            runner: macos-15
            build-args: --mac dmg zip --arm64
            artifact-name: bloom-canvas-macos-arm64
            artifact-path: |
              dist/*-mac-arm64.dmg
              dist/*-mac-arm64.zip
              dist/*-mac-arm64.zip.blockmap
              dist/latest-mac.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build application
        run: yarn electron-vite build

      - name: Build installer
        run: yarn electron-builder ${{ matrix.build-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Merge macOS update metadata
        run: |
          node scripts/merge-mac-update-metadata.mjs \
            release-assets/latest-mac.yml \
            release-assets/bloom-canvas-macos-x64/latest-mac.yml \
            release-assets/bloom-canvas-macos-arm64/latest-mac.yml

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "title=绽画 ${version}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "${RELEASE_TAG}" \
            release-assets/bloom-canvas-windows-x64/* \
            release-assets/bloom-canvas-macos-x64/*.dmg \
            release-assets/bloom-canvas-macos-x64/*.zip* \
            release-assets/bloom-canvas-macos-arm64/*.dmg \
            release-assets/bloom-canvas-macos-arm64/*.zip* \
            release-assets/latest-mac.yml \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            --latest
